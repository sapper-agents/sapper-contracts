[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[dependencies]
"@openzeppelin-contracts" = "5.4.0"
forge-std = "1.11.0"

[lint]
lint_on_build = false

[soldeer]
remappings_generate = false
